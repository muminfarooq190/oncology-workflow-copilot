name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orchestrator/pyproject.toml
      - run: python -m pip install "jsonschema>=4.23,<5.0"
      - run: python scripts/validate_repository.py

  orchestrator:
    name: FastAPI orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orchestrator/pyproject.toml
      - run: python -m pip install -e "./services/orchestrator[dev]"
      - run: python -m ruff check services/orchestrator
      - run: python -m pytest services/orchestrator/tests

  web:
    name: React web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  fhir-integration:
    name: .NET FHIR integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fhir-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

