name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orchestrator/pyproject.toml
      - run: python -m pip install "jsonschema>=4.23,<5.0"
      - run: python scripts/validate_repository.py

  orchestrator:
    name: FastAPI orchestrator
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oncology_test
          POSTGRES_USER: oncology
          POSTGRES_PASSWORD: oncology
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oncology -d oncology_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://oncology:oncology@localhost:5432/oncology_test
      REDIS_URL: redis://localhost:6379/15
      RUN_INTEGRATION_TESTS: "1"
      WORKFLOW_RETRY_DELAY_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orchestrator/pyproject.toml
      - run: python -m pip install -e "./services/orchestrator[dev]"
      - run: alembic -c services/orchestrator/alembic.ini upgrade head
      - run: python -m ruff check services/orchestrator evals scripts
      - run: python -m pytest services/orchestrator/tests

  web:
    name: React web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  fhir-integration:
    name: .NET FHIR integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fhir-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore tests/OncologyCopilot.FhirIntegration.Tests.csproj
      - run: dotnet build tests/OncologyCopilot.FhirIntegration.Tests.csproj --configuration Release --no-restore
      - run: dotnet test tests/OncologyCopilot.FhirIntegration.Tests.csproj --configuration Release --no-build --no-restore
