[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oncology-copilot-orchestrator"
version = "0.3.0"
description = "Evaluation-first workflow orchestration for the Oncology Workflow Copilot"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "redis>=6.1,<7.0",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.32,<1.0"
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<2.0",
  "ruff>=0.8,<1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: requires PostgreSQL and Redis"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
