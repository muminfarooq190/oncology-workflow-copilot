name: oncology-workflow-copilot

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: oncology
      POSTGRES_USER: oncology
      POSTGRES_PASSWORD: oncology
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncology -d oncology"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-development-only
    ports:
      - "8082:8080"
    volumes:
      - ./infra/docker/keycloak/oncology-copilot-realm.json:/opt/keycloak/data/import/oncology-copilot-realm.json:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  fhir-integration:
    build:
      context: ./services/fhir-integration
    environment:
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8081:8080"
    depends_on:
      - otel-collector

  orchestrator:
    build:
      context: ./services/orchestrator
    env_file:
      - .env
    environment:
      FHIR_INTEGRATION_URL: http://fhir-integration:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8000:8000"
    depends_on:
      orchestrator-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fhir-integration:
        condition: service_started

  orchestrator-migrate:
    build:
      context: ./services/orchestrator
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator-dispatcher:
    build:
      context: ./services/orchestrator
    command: ["python", "-m", "app.outbox"]
    env_file:
      - .env
    depends_on:
      orchestrator-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  orchestrator-worker:
    build:
      context: ./services/orchestrator
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      FHIR_INTEGRATION_URL: http://fhir-integration:8080
    depends_on:
      orchestrator-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      fhir-integration:
        condition: service_started

  web:
    build:
      context: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - orchestrator

volumes:
  postgres-data:
  redis-data:
